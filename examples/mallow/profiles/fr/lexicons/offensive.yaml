# These words are published on purpose: Mallow makes its safety decisions in the open, and a filter is easier to
# review and correct when anyone can read what it catches. Listing a word here does not endorse it; it is listed so
# a child's game never repeats it.
#
# Words that flag a player input, warned about by the game engine and read by the decision model.
#
# The LLM does not always know these words: it takes old-fashioned insults, slang and coded slurs for invented words,
# creature names or ingredients, and repeats them.
#
# - Matching ignores case and accents, and only matches whole words.
# - A plural in -s or -x also matches: "crouille" flags "crouilles". Irregular plurals ("trannies") are entries of
#   their own.
# - `prefix: true` matches any ending: "chinetoqu" flags "chinetoque" and "chinetoques". Leave it out for a word
#   whose prefix would also catch common words ("spic" and "spice").
# - Several words match with any spacing or hyphenation between them.
# - `languages` restricts an entry to games in those languages, for a word that is innocent in another one.
# - `meaning` tells the classifier and the agent what the word means, which they often don't know.
#
# Leave out words with an innocent meaning a child could use ("raton" as in raton laveur, "tapette", "pédale",
# "morue", "chatte", "bride", "coon", "spade"): flagging them would make the agent dodge normal answers.
# Spell out feminine forms and common spelling variants, since the speech recognition picks any of them.

reminds: SWEAR_WORDS


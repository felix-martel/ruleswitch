[project]
name = "ruleswitch"
version = "0.1.0"
description = "Behavior policies as code: classify a turn, prescribe the response, check that it complies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Félix Martel" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.11",
    "yamlrocks>=0.7.1",
]

[project.urls]
Repository = "https://github.com/felix-martel/ruleswitch"

[project.scripts]
ruleswitch = "ruleswitch.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.13"

# The toy policies `ruleswitch init` starts from.
[tool.hatch.build.targets.wheel.force-include]
"examples/rbr" = "ruleswitch/examples/rbr"
"examples/three_laws" = "ruleswitch/examples/three_laws"

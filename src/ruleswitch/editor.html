<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ruleswitch</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: #18181b; background: #fafafa; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e4e4e7; position: sticky; top: 0; z-index: 2; }
  header b { font-size: 15px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #dcfce7; color: #166534; }
  .badge.bad { background: #fee2e2; color: #991b1b; }
  .muted { color: #71717a; }
  button { font: inherit; padding: 4px 12px; border: 1px solid #d4d4d8; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #18181b; color: #fff; border-color: #18181b; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; padding: 16px 20px; align-items: start; }
  nav { display: flex; gap: 4px; margin-bottom: 12px; }
  nav button { border-color: transparent; background: transparent; }
  nav button.on { background: #fff; border-color: #d4d4d8; font-weight: 600; }
  #problems:not(:empty) { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; }
  .panel { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 16px; }
  .tier { margin-bottom: 24px; }
  .tier h2 { font-size: 16px; margin: 0 0 2px; }
  .tier p { margin: 0 0 8px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #e4e4e7; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #f4f4f5; font-weight: 600; font-size: 12px; }
  .grid td.cell { cursor: pointer; font-size: 12px; min-width: 90px; }
  .grid td.cell:hover { background: #f4f4f5; }
  .grid td.cell.selected { outline: 2px solid #2563eb; outline-offset: -2px; }
  .grid td.cell.landed { background: #dbeafe; }
  .grid .axis { color: #71717a; }
  .editor { margin-top: 8px; padding: 10px 12px; border: 1px solid #bfdbfe; background: #eff6ff; border-radius: 6px; }
  .editor .row { margin-bottom: 6px; }
  .editor label { margin-right: 10px; white-space: nowrap; }
  #files-bar { display: flex; gap: 8px; margin-bottom: 8px; }
  #text { width: 100%; height: calc(100vh - 190px); font: 12px/1.5 ui-monospace, monospace; padding: 10px; border: 1px solid #d4d4d8; border-radius: 6px; resize: vertical; tab-size: 2; }
  #changes { margin: 0; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; }
  .md table { margin: 8px 0 16px; font-size: 13px; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; margin-top: 28px; } .md h3 { font-size: 15px; }
  aside { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  aside h2 { font-size: 16px; margin: 0 0 8px; }
  aside h3 { font-size: 13px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .03em; color: #52525b; }
  aside textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid #d4d4d8; border-radius: 6px; margin-bottom: 6px; resize: vertical; }
  aside table { width: 100%; font-size: 13px; }
  aside select { font: inherit; width: 100%; }
  aside th { width: 70px; }
  .scores { font-size: 11px; color: #71717a; }
  .nudge { white-space: pre-wrap; font: inherit; font-size: 12px; background: #f4f4f5; border-radius: 6px; padding: 8px; margin: 0; }
  .ok { color: #166534; font-weight: 600; } .ko { color: #991b1b; font-weight: 600; }
  .error { color: #991b1b; white-space: pre-wrap; }
  a.cell-link { color: #2563eb; cursor: pointer; text-decoration: underline; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b id="name">ruleswitch</b>
  <span id="status" class="badge"></span>
  <span id="dirty" class="muted"></span>
  <span style="flex: 1"></span>
  <button id="save" class="primary" disabled>Save</button>
</header>
<main>
  <section>
    <nav>
      <button data-tab="grids" class="on">Grids</button>
      <button data-tab="document">Document</button>
      <button data-tab="files">Files</button>
      <button data-tab="changes">Changes</button>
    </nav>
    <div id="problems"></div>
    <div id="tab-grids" class="panel"></div>
    <div id="tab-document" class="panel md" hidden></div>
    <div id="tab-files" hidden>
      <div id="files-bar"><select id="file"></select></div>
      <textarea id="text" spellcheck="false"></textarea>
    </div>
    <div id="tab-changes" class="panel" hidden><pre id="changes"></pre></div>
  </section>
  <aside class="panel">
    <h2>Try</h2>
    <textarea id="turn" rows="3" placeholder="A user's turn"></textarea>
    <textarea id="response" rows="2" placeholder="The agent's response (optional)"></textarea>
    <button id="classify" class="primary">Classify</button>
    <span id="busy" class="muted"></span>
    <div id="result"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let saved = {}, texts = {}, policy = null, hasClassifier = false;
let selected = null; // the cell whose editor is open: {tier, position}
let attempt = null; // the try panel's last result

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);
  return data;
}

// Only the files that differ from disk travel: the server reads the others.
const unsaved = () => Object.fromEntries(Object.entries(texts).filter(([n, t]) => t !== saved[n]));

async function refresh() {
  const view = await api("/api/view", { files: unsaved() });
  const dirty = Object.keys(unsaved());
  $("dirty").textContent = dirty.length ? `unsaved: ${dirty.join(", ")}` : "";
  $("save").disabled = !dirty.length;
  $("problems").textContent = view.problems.join("\n");
  $("status").textContent = view.problems.length ? `${view.problems.length} problem${view.problems.length > 1 ? "s" : ""}` : "no problems";
  $("status").className = "badge" + (view.problems.length ? " bad" : "");
  renderFiles();
  if (!view.policy) return; // the files don't load: keep showing the last policy that did
  policy = view.policy;
  $("name").textContent = policy.name;
  $("tab-document").innerHTML = markdown(view.document);
  $("changes").textContent = view.changes;
  renderGrids();
  if (attempt) renderAttempt();
}

let timer;
const refreshSoon = () => { clearTimeout(timer); timer = setTimeout(refresh, 400); };

// --- tabs
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
function showTab(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  for (const t of ["grids", "document", "files", "changes"]) $("tab-" + t).hidden = t !== tab;
}

// --- grids
const product = (lists) => lists.reduce((acc, l) => acc.flatMap((a) => l.map((v) => [...a, v])), [[]]);
const responseAxis = (id) => policy.response_axes.find((a) => a.id === id);

function cellSummary(allowed) {
  const axes = policy.response_axes.filter((a) => allowed[a.id]).map((a) => [a.id, allowed[a.id]]);
  if (!axes.length) return '<span class="muted">any</span>';
  return axes.map(([axis, ids]) => `<span class="axis">${esc(axis)}</span> ${ids.map(esc).join(", ")}`).join("<br>");
}

function renderGrids() {
  const landed = attempt?.prescription?.cell;
  $("tab-grids").innerHTML = policy.tiers.map((tier) => {
    const keys = Object.keys(tier.condition);
    const columns = product(keys.slice(1).map((k) => tier.condition[k]));
    const head = `<tr><th>${esc(keys[0])}${keys.length > 1 ? " \\ " + esc(keys.slice(1).join(" / ")) : ""}</th>` +
      columns.map((c) => `<th>${c.length ? esc(c.join(" / ")) : "allowed"}</th>`).join("") + "</tr>";
    const rows = tier.condition[keys[0]].map((row) => `<tr><th>${esc(row)}</th>` + columns.map((c) => {
      const position = [row, ...c], id = [tier.id, ...position].join("/");
      const isSelected = selected && selected.tier === tier.id && selected.position.join("/") === position.join("/");
      return `<td class="cell${isSelected ? " selected" : ""}${id === landed ? " landed" : ""}" data-tier="${esc(tier.id)}" data-position="${esc(position.join("/"))}">${cellSummary(tier.cells[id])}</td>`;
    }).join("") + "</tr>").join("");
    const editing = selected && selected.tier === tier.id;
    return `<div class="tier" id="tier-${esc(tier.id)}"><h2>${esc(tier.label)} <span class="muted">${esc(tier.id)}</span></h2>
      <p class="muted">${esc(tier.definition)} ${esc(tier.instruction)}</p>
      <table class="grid">${head}${rows}</table>${editing ? cellEditor(tier) : ""}</div>`;
  }).join("") + '<p class="muted">A turn outside every tier gets no prescription: only the prohibitions apply.</p>';
  document.querySelectorAll("td.cell").forEach((td) => td.onclick = () => {
    selected = { tier: td.dataset.tier, position: td.dataset.position.split("/") };
    renderGrids();
  });
  const editor = document.querySelector(".editor");
  if (editor) {
    editor.querySelector(".apply").onclick = applyCell;
    editor.querySelector(".cancel").onclick = () => { selected = null; renderGrids(); };
  }
}

function cellEditor(tier) {
  const id = [tier.id, ...selected.position].join("/");
  const allowed = tier.cells[id] || {};
  const rows = policy.response_axes.map((axis) => `<div class="row"><b>${esc(axis.id)}</b>: ` + axis.values.map((v) =>
    `<label title="${esc(v.label)}"><input type="checkbox" data-axis="${esc(axis.id)}" value="${esc(v.id)}"${(allowed[axis.id] || []).includes(v.id) ? " checked" : ""}> ${esc(v.id)}</label>`
  ).join("") + "</div>").join("");
  return `<div class="editor"><div class="row"><b>${esc(id)}</b> <span class="muted">An axis with nothing checked allows any value.</span></div>
    ${rows}<button class="apply primary">Apply</button> <button class="cancel">Close</button></div>`;
}

async function applyCell() {
  const allowed = Object.fromEntries(policy.response_axes.map((a) => [a.id, []]));
  document.querySelectorAll(".editor input:checked").forEach((i) => allowed[i.dataset.axis].push(i.value));
  try {
    const { text } = await api("/api/cell", { files: unsaved(), ...selected, allowed });
    texts[profileName()] = text;
    await refresh();
  } catch (e) { alert(e.message); }
}

const profileName = () => Object.keys(saved).find((n) => n.endsWith("/profile.yaml") || n === "profile.yaml");

// --- files
function renderFiles() {
  const current = $("file").value || profileName();
  $("file").innerHTML = Object.keys(texts).map((n) => `<option value="${esc(n)}">${esc(n)}${texts[n] !== saved[n] ? " •" : ""}</option>`).join("");
  $("file").value = current;
}
$("file").onchange = () => { $("text").value = texts[$("file").value]; };
$("text").oninput = () => { texts[$("file").value] = $("text").value; refreshSoon(); };
$("text").onkeydown = (e) => {
  if (e.key !== "Tab") return;
  e.preventDefault();
  $("text").setRangeText("  ", $("text").selectionStart, $("text").selectionEnd, "end");
  $("text").oninput();
};

async function save() {
  const files = unsaved();
  if (!Object.keys(files).length) return;
  await api("/api/save", { files });
  Object.assign(saved, files);
  await refresh();
}
$("save").onclick = save;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); }
});

// --- try panel
async function tryIt(values) {
  $("busy").textContent = values ? "" : "classifying…";
  const body = { files: unsaved(), turn: $("turn").value, response: $("response").value, ...values };
  try {
    attempt = await api("/api/try", body);
    renderAttempt();
    renderGrids();
  } catch (e) {
    $("result").innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
  $("busy").textContent = "";
}
$("classify").onclick = () => tryIt();
$("turn").onkeydown = $("response").onkeydown = (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && hasClassifier) tryIt();
};

function chosen() {
  const turn_values = {}, response_values = {};
  document.querySelectorAll("#result select[data-side=turn]").forEach((s) => turn_values[s.dataset.axis] = s.value);
  document.querySelectorAll("#result select[data-side=response]").forEach((s) => { if (s.value) response_values[s.dataset.axis] = s.value; });
  document.querySelectorAll("#result input[data-side=response]").forEach((i) => {
    response_values[i.dataset.axis] ??= [];
    if (i.checked) response_values[i.dataset.axis].push(i.value);
  });
  const anyResponse = Object.values(response_values).some((v) => typeof v === "string" || v.length);
  return { turn_values, response_values: anyResponse ? response_values : null };
}

function scores(c, axis) {
  const answer = c.scores?.[axis.id];
  if (!answer?.probabilities) return c.evidence?.[axis.id] ? `“${esc(c.evidence[axis.id])}”` : "";
  const ids = axis.values.map((v) => v.id);
  return Object.entries(answer.probabilities)
    .map(([k, p]) => [answer.type === "score" ? ids[+k] : k, p]).sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([k, p]) => `${esc(k)} ${p.toFixed(2)}`).join(" · ");
}

function questions(c) {
  return Object.entries(c.scores || {}).filter(([k]) => k.includes(":")).sort((a, b) => (b[1].noul ?? 0) - (a[1].noul ?? 0))
    .slice(0, 4).map(([k, a]) => `${esc(k)} ${(a.noul ?? 0).toFixed(2)}`).join(" · ");
}

function axisRows(side, axes, c) {
  return axes.map((axis) => {
    const value = c?.values?.[axis.id];
    let control;
    if (axis.multi) {
      const taken = Array.isArray(value) ? value : value ? [value] : [];
      control = axis.values.map((v) => `<label title="${esc(v.label)}" style="white-space:nowrap"><input type="checkbox" data-side="${side}" data-axis="${esc(axis.id)}" value="${esc(v.id)}"${taken.includes(v.id) ? " checked" : ""}> ${esc(v.id)}</label>`).join(" ");
    } else {
      const blank = side === "response" ? '<option value="">—</option>' : "";
      control = `<select data-side="${side}" data-axis="${esc(axis.id)}">${blank}` + axis.values.map((v) =>
        `<option value="${esc(v.id)}"${v.id === value ? " selected" : ""}>${esc(v.id)} · ${esc(v.label)}</option>`).join("") + "</select>";
    }
    return `<tr><th>${esc(axis.id)}</th><td>${control}<div class="scores">${c ? scores(c, axis) : ""}</div></td></tr>`;
  }).join("");
}

function renderAttempt() {
  const a = attempt, p = a.prescription;
  const allowed = p ? Object.entries(p.allowed).map(([axis, ids]) => `<div><b>${esc(axis)}</b>: ${ids.map((id) => esc(responseAxis(axis)?.values.find((v) => v.id === id)?.label ?? id)).join(" or ")}</div>`).join("") || '<div class="muted">any value: only the prohibitions apply</div>' : "";
  const reminders = [...a.turn.reminders.map((r) => `<div>reminds <b>${esc(r)}</b></div>`),
    ...a.hits.map((h) => `<div>“${esc(h.text)}” reminds <b>${esc(h.reminds)}</b> <span class="muted">${esc(h.meaning)}</span></div>`)].join("");
  const compliance = a.compliance ? (a.compliance.ok ? '<p class="ok">Complies</p>' : '<p class="ko">Does not comply</p>' +
    a.compliance.articles.map((x) => `<div>${esc(x.kind)} <b>${esc(x.id)}</b> ${esc(x.detail)}</div>`).join("")) : "";
  const breaches = (a.response?.breaches || []).filter((b) => b.quote).map((b) => `<div class="scores">${esc(b.prohibition)}: “${esc(b.quote)}” ${esc(b.why)}</div>`).join("");
  $("result").innerHTML = `
    <h3>Turn</h3><table>${axisRows("turn", policy.turn_axes, a.turn)}</table>
    <div class="scores">${questions(a.turn)}</div>${reminders}
    <h3>Prescription</h3>${p ? `<div><a class="cell-link" data-cell="${esc(p.cell)}">${esc(p.cell)}</a></div>${allowed}` : '<p class="muted">No tier applies: only the prohibitions constrain the response.</p>'}
    <h3>Nudge</h3>${a.nudge ? `<pre class="nudge">${esc(a.nudge)}</pre>` : '<p class="muted">None: the agent would respond right unprompted.</p>'}
    <h3>Response</h3><table>${axisRows("response", policy.response_axes, a.response)}</table>
    <div class="scores">${a.response ? questions(a.response) : ""}</div>
    ${compliance}${breaches}`;
  document.querySelectorAll("#result select, #result input").forEach((el) => el.onchange = () => tryIt(chosen()));
  const link = document.querySelector("a.cell-link");
  if (link) link.onclick = () => {
    const [tier, ...position] = link.dataset.cell.split("/");
    selected = { tier, position };
    showTab("grids");
    renderGrids();
    $("tier-" + tier).scrollIntoView({ behavior: "smooth" });
  };
}

// --- a small Markdown renderer for the `document` rendering: headings, lists, tables, emphasis, code, <br>
function inline(s) {
  return esc(s).replace(/&lt;br&gt;/g, "<br>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
}
function markdown(text) {
  const out = [], lines = text.split("\n");
  const cells = (line) => line.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => inline(c.trim().replace(/\\\|/g, "|")));
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^(#{1,4}) (.*)/))) out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    else if (line.startsWith("|") && lines[i + 1]?.match(/^\|[-| ]+\|$/)) {
      const rows = [`<tr>${cells(line).map((c) => `<th>${c}</th>`).join("")}</tr>`];
      for (i += 2; i < lines.length && lines[i].startsWith("|"); i++) rows.push(`<tr>${cells(lines[i]).map((c) => `<td>${c}</td>`).join("")}</tr>`);
      i--;
      out.push(`<table>${rows.join("")}</table>`);
    } else if ((m = line.match(/^(\d+\.|-) (.*)/))) {
      const tag = m[1] === "-" ? "ul" : "ol", items = [];
      for (; i < lines.length && (m = lines[i].match(/^(\d+\.|-) (.*)/)); i++) items.push(`<li>${inline(m[2])}</li>`);
      i--;
      out.push(`<${tag}>${items.join("")}</${tag}>`);
    } else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  return out.join("\n");
}

(async () => {
  const start = await api("/api/files");
  saved = start.files;
  texts = { ...saved };
  hasClassifier = start.classifier;
  $("classify").hidden = !hasClassifier;
  await refresh();
  $("text").value = texts[$("file").value];
  if (!hasClassifier) {
    $("turn").oninput = () => { clearTimeout(timer); timer = setTimeout(() => tryIt(chosen()), 400); };
    // No classifier: the try panel starts from each turn axis's first value, set by hand.
    tryIt({ turn_values: Object.fromEntries(policy.turn_axes.map((a) => [a.id, a.values[0].id])), response_values: null });
  }
})();
</script>
</body>
</html>

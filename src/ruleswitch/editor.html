<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ruleswitch</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --line: #e4e4e7; --muted: #71717a; --soft: #f4f4f5;
    /* The only green and red on the page: a response complies, or it doesn't. */
    --ok: #15803d; --ok-bg: #dcfce7; --ko: #b91c1c; --ko-bg: #fee2e2;
    --warn: #92400e; --warn-bg: #fef3c7;
  }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #18181b; background: #fafafa; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
  header b { font-size: 15px; }
  nav { display: flex; gap: 2px; margin-left: 16px; }
  nav button { border-color: transparent; background: transparent; color: var(--muted); }
  nav button.on { color: #18181b; background: var(--soft); font-weight: 600; }
  .muted { color: var(--muted); }
  .id { color: var(--muted); font-style: italic; font-weight: normal; }
  .warn { color: var(--warn); background: var(--warn-bg); padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid #d4d4d8; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #18181b; color: #fff; border-color: #18181b; }
  button:disabled { opacity: .45; cursor: default; }
  code { font: 12px ui-monospace, monospace; background: var(--soft); padding: 1px 4px; border-radius: 4px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: calc(100vh - 53px); }
  body.no-try main { grid-template-columns: minmax(0, 1fr); }
  body.no-try aside { display: none; }
  section { padding: 20px 28px 60px; min-width: 0; }
  /* Text keeps a readable measure, centered; tables take the full width. */
  .page > :not(table, .table) { max-width: 760px; margin-left: auto; margin-right: auto; }
  .page table { margin: 8px auto 20px; }
  .table { overflow-x: auto; }
  #problems:not(:empty) { max-width: 760px; margin: 0 auto 16px; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 12px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; }

  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: var(--soft); font-weight: 600; font-size: 12px; }
  .page h1 { font-size: 22px; } .page h2 { font-size: 17px; margin-top: 32px; } .page h3 { font-size: 15px; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: #fef9c3; } to { background: transparent; } }

  .grid { background: #fff; }
  .grid.wide { width: 100%; }
  .grid td.cell { cursor: pointer; font-size: 12px; }
  .grid td.cell:hover { background: #fafafa; }
  .grid td.cell.selected { outline: 2px solid #18181b; outline-offset: -2px; }
  .grid td.cell.landed { box-shadow: inset 0 0 0 2px #a1a1aa; }
  .grid td.cell.landed.ok { background: var(--ok-bg); box-shadow: none; }
  .grid td.cell.landed.ko { background: var(--ko-bg); box-shadow: none; }
  .grid .axis { color: var(--muted); }
  .editor { margin: 8px auto 0; padding: 10px 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; }
  .editor .row { margin-bottom: 6px; }
  .editor label { margin-right: 10px; white-space: nowrap; }

  #files-bar { margin-bottom: 8px; }
  #text { width: 100%; height: calc(100vh - 170px); font: 12px/1.5 ui-monospace, monospace; padding: 10px; border: 1px solid #d4d4d8; border-radius: 6px; resize: vertical; tab-size: 2; }
  #changes { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; }

  /* An id that opens its definition: quiet until hovered. */
  .ref { color: inherit; text-decoration: underline dotted #d4d4d8; text-underline-offset: 3px; cursor: pointer; }
  .ref:hover { color: #1d4ed8; text-decoration-color: currentColor; }
  td.cell .ref { cursor: inherit; }
  #peek { position: fixed; z-index: 5; max-width: 360px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .12); padding: 8px 10px; font-size: 12px; pointer-events: none; }
  #peek b { font-size: 13px; }

  aside { background: #fff; border-left: 1px solid var(--line); padding: 16px 18px 40px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow: auto; }
  aside textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid #d4d4d8; border-radius: 6px; margin-bottom: 6px; resize: vertical; }
  aside h3 { font-size: 12px; margin: 16px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: #52525b; }
  aside table { width: 100%; font-size: 13px; }
  aside th { width: 80px; }
  aside select { font: inherit; width: 100%; }
  .verdict { margin-top: 14px; font-size: 13px; }
  .verdict ul { margin: 4px 0 0; padding-left: 18px; color: #52525b; }
  .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); } .pill.ko { color: var(--ko); background: var(--ko-bg); }
  th.ko { color: var(--ko); }
  .scores { font-size: 11px; color: var(--muted); }
  .nudge { white-space: pre-wrap; font: inherit; font-size: 12px; background: var(--soft); border-radius: 6px; padding: 8px; margin: 0; }
  .note { font-size: 12px; background: var(--soft); border-radius: 6px; padding: 8px 10px; }
  .note pre { white-space: pre-wrap; margin: 6px 0 0; font: 11px/1.5 ui-monospace, monospace; }
  .error { color: var(--warn); white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b id="name">ruleswitch</b>
  <span id="status" class="muted"></span>
  <nav>
    <button data-tab="document" class="on">Document</button>
    <button data-tab="grids">Grids</button>
    <button data-tab="files">Files</button>
    <button data-tab="changes">Changes</button>
  </nav>
  <span style="flex: 1"></span>
  <span id="dirty" class="muted"></span>
  <button id="save" class="primary" disabled>Save</button>
  <button id="toggle-try" title="Show or hide the try panel">Try</button>
</header>
<main>
  <section>
    <div id="problems"></div>
    <div id="tab-document" class="page"></div>
    <div id="tab-grids" class="page" hidden></div>
    <div id="tab-files" hidden>
      <div id="files-bar"><select id="file"></select></div>
      <textarea id="text" spellcheck="false"></textarea>
    </div>
    <div id="tab-changes" class="page" hidden><pre id="changes"></pre></div>
  </section>
  <aside>
    <textarea id="turn" rows="3" placeholder="A user's turn"></textarea>
    <textarea id="response" rows="2" placeholder="The agent's response (optional)"></textarea>
    <button id="classify" class="primary">Classify</button>
    <span id="busy" class="muted"></span>
    <div id="result"></div>
  </aside>
</main>
<div id="peek" hidden></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let saved = {}, texts = {}, policy = null, hasClassifier = false;
let selected = null; // the cell whose editor is open: {tier, position}
let attempt = null; // the try panel's last result

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);
  return data;
}

// Only the files that differ from disk travel: the server reads the others.
const unsaved = () => Object.fromEntries(Object.entries(texts).filter(([n, t]) => t !== saved[n]));

async function refresh() {
  const view = await api("/api/view", { files: unsaved() });
  const dirty = Object.keys(unsaved());
  $("dirty").textContent = dirty.length ? `unsaved: ${dirty.join(", ")}` : "";
  $("save").disabled = !dirty.length;
  $("problems").textContent = view.problems.join("\n");
  const n = view.problems.length;
  $("status").textContent = n ? `${n} problem${n > 1 ? "s" : ""}` : "no problems";
  $("status").className = n ? "warn" : "muted";
  renderFiles();
  if (!view.policy) return; // the files don't load: keep showing the last policy that did
  policy = view.policy;
  $("name").textContent = policy.name;
  $("tab-document").innerHTML = markdown(view.document);
  linkIds($("tab-document"));
  $("changes").textContent = view.changes;
  renderGrids();
  renderAttempt();
}

let timer;
const refreshSoon = () => { clearTimeout(timer); timer = setTimeout(refresh, 400); };

// --- tabs
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
function showTab(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  for (const t of ["document", "grids", "files", "changes"]) $("tab-" + t).hidden = t !== tab;
}
$("toggle-try").onclick = () => document.body.classList.toggle("no-try");

// --- ids: a quiet link that previews its definition on hover and jumps to it on click
const ref = (kind, key, text) => `<a class="ref" data-ref="${esc(kind)}:${esc(key)}">${esc(text ?? key)}</a>`;
const axisOf = (id) => [...policy.turn_axes, ...policy.response_axes].find((a) => a.id === id);
const tierOf = (id) => policy.tiers.find((t) => t.id === id);
const tierNumber = (id) => policy.tiers.findIndex((t) => t.id === id) + 1;
const valueRef = (axis, id) => ref("value", `${axis}/${id}`, id);

function preview(kind, key) {
  if (kind === "value") {
    const [axis, id] = key.split("/"), v = axisOf(axis)?.values.find((x) => x.id === id);
    return v && `<b>${esc(v.label)}</b> <span class="id">${esc(axis)} ${esc(id)}</span><div>${esc(v.definition)}</div>`;
  }
  if (kind === "axis") { const a = axisOf(key); return a && `<b>${esc(a.id)}</b><div>${esc(a.definition)}</div>`; }
  if (kind === "prohibition") {
    const p = policy.prohibitions.find((x) => x.id === key);
    return p && `<b>${esc(p.id)}</b><div>${esc(p.text)}</div>`;
  }
  const [tierId] = key.split("/"), t = tierOf(tierId);
  if (!t) return null;
  const head = `<b>Tier ${tierNumber(t.id)}: ${esc(t.label)}</b> <span class="id">${esc(kind === "cell" ? key : t.id)}</span>`;
  return kind === "cell" ? `${head}<div>${cellSummary(t.cells[key] || {})}</div>` : `${head}<div>${esc(t.definition)} ${esc(t.instruction)}</div>`;
}

function jump(kind, key) {
  if (kind === "cell") {
    const [tier, ...position] = key.split("/");
    selected = { tier, position };
    showTab("grids");
    renderGrids();
    return flash(document.querySelector(`td.cell[data-tier="${CSS.escape(tier)}"][data-position="${CSS.escape(position.join("/"))}"]`));
  }
  showTab("document");
  flash(document.getElementById(`def-${kind}-${key.replace("/", "-")}`));
}
function flash(el) {
  if (!el) return;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

let peekTimer;
document.addEventListener("mouseover", (e) => {
  const a = e.target.closest?.(".ref");
  clearTimeout(peekTimer);
  if (!a) return void ($("peek").hidden = true);
  peekTimer = setTimeout(() => {
    const [kind, ...rest] = a.dataset.ref.split(":"), html = preview(kind, rest.join(":"));
    if (!html) return;
    const peek = $("peek"), box = a.getBoundingClientRect();
    peek.innerHTML = html;
    peek.hidden = false;
    peek.style.left = Math.max(8, Math.min(box.left, innerWidth - peek.offsetWidth - 8)) + "px";
    peek.style.top = (box.bottom + 6 + peek.offsetHeight > innerHeight ? box.top - peek.offsetHeight - 6 : box.bottom + 6) + "px";
  }, 250);
});
document.addEventListener("click", (e) => {
  const a = e.target.closest(".ref");
  if (!a || a.closest("td.cell")) return; // a click in a cell edits the cell
  const [kind, ...rest] = a.dataset.ref.split(":");
  $("peek").hidden = true;
  jump(kind, rest.join(":"));
});

// Cell ids and prohibition ids are unambiguous wherever they appear; value ids are not (NONE), so they stay text.
function linkIds(root) {
  const ids = new Map(policy.prohibitions.map((p) => [p.id, "prohibition"]));
  policy.tiers.forEach((t) => Object.keys(t.cells).forEach((c) => ids.set(c, "cell")));
  const pattern = new RegExp(`(?<![\\w/])(${[...ids.keys()].sort((a, b) => b.length - a.length).map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})(?![\\w/])`, "g");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) if (pattern.test(walker.currentNode.data)) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const span = document.createElement("span");
    span.innerHTML = esc(node.data).replace(pattern, (id) => ref(ids.get(id), id));
    node.replaceWith(...span.childNodes);
  }
}

// --- grids
const product = (lists) => lists.reduce((acc, l) => acc.flatMap((a) => l.map((v) => [...a, v])), [[]]);

function cellSummary(allowed) {
  const axes = policy.response_axes.filter((a) => allowed[a.id]);
  if (!axes.length) return '<span class="muted">any</span>';
  return axes.map((a) => `<span class="axis">${esc(a.id)}</span> ${allowed[a.id].map((v) => valueRef(a.id, v)).join(", ")}`).join("<br>");
}

function renderGrids() {
  const landed = attempt?.prescription?.cell;
  const verdict = attempt?.compliance ? (attempt.compliance.ok ? " ok" : " ko") : "";
  $("tab-grids").innerHTML = policy.tiers.map((tier, i) => {
    const keys = Object.keys(tier.condition);
    const columns = product(keys.slice(1).map((k) => tier.condition[k]));
    const corner = ref("axis", keys[0]) + (keys.length > 1 ? " \\ " + keys.slice(1).map((k) => ref("axis", k)).join(" / ") : "");
    const head = `<tr><th>${corner}</th>` + columns.map((c) =>
      `<th>${c.length ? c.map((v, j) => valueRef(keys[j + 1], v)).join(" / ") : "allowed"}</th>`).join("") + "</tr>";
    const rows = tier.condition[keys[0]].map((row) => `<tr><th>${valueRef(keys[0], row)}</th>` + columns.map((c) => {
      const position = [row, ...c], id = [tier.id, ...position].join("/");
      const isSelected = selected?.tier === tier.id && selected.position.join("/") === position.join("/");
      return `<td class="cell${isSelected ? " selected" : ""}${id === landed ? " landed" + verdict : ""}" data-tier="${esc(tier.id)}" data-position="${esc(position.join("/"))}">${cellSummary(tier.cells[id])}</td>`;
    }).join("") + "</tr>").join("");
    return `<h2 id="grid-${esc(tier.id)}">Tier ${i + 1}: ${esc(tier.label)} <span class="id">${esc(tier.id)}</span></h2>
      <p class="muted">${esc(tier.definition)} ${esc(tier.instruction)}</p>
      <div class="table"><table class="grid${columns.length > 1 ? " wide" : ""}">${head}${rows}</table></div>${selected?.tier === tier.id ? cellEditor(tier) : ""}`;
  }).join("") + '<p class="muted">A turn outside every tier gets no prescription: only the prohibitions apply.</p>';
  document.querySelectorAll("td.cell").forEach((td) => td.onclick = () => {
    selected = { tier: td.dataset.tier, position: td.dataset.position.split("/") };
    renderGrids();
  });
  const editor = document.querySelector(".editor");
  if (editor) {
    editor.querySelector(".apply").onclick = applyCell;
    editor.querySelector(".cancel").onclick = () => { selected = null; renderGrids(); };
  }
}

function cellEditor(tier) {
  const id = [tier.id, ...selected.position].join("/");
  const allowed = tier.cells[id] || {};
  const rows = policy.response_axes.map((axis) => `<div class="row"><b>${ref("axis", axis.id)}</b>: ` + axis.values.map((v) =>
    `<label title="${esc(v.label)}: ${esc(v.definition)}"><input type="checkbox" data-axis="${esc(axis.id)}" value="${esc(v.id)}"${(allowed[axis.id] || []).includes(v.id) ? " checked" : ""}> ${esc(v.id)}</label>`
  ).join("") + "</div>").join("");
  return `<div class="editor"><div class="row"><b>${esc(id)}</b> <span class="muted">An axis with nothing checked allows any value.</span></div>
    ${rows}<button class="apply primary">Apply</button> <button class="cancel">Close</button></div>`;
}

async function applyCell() {
  const allowed = Object.fromEntries(policy.response_axes.map((a) => [a.id, []]));
  document.querySelectorAll(".editor input:checked").forEach((i) => allowed[i.dataset.axis].push(i.value));
  try {
    const { text } = await api("/api/cell", { files: unsaved(), ...selected, allowed });
    texts[profileName()] = text;
    await refresh();
  } catch (e) { alert(e.message); }
}

const profileName = () => Object.keys(saved).find((n) => n.endsWith("/profile.yaml") || n === "profile.yaml");

// --- files
function renderFiles() {
  const current = $("file").value || profileName();
  $("file").innerHTML = Object.keys(texts).map((n) => `<option value="${esc(n)}">${esc(n)}${texts[n] !== saved[n] ? " •" : ""}</option>`).join("");
  $("file").value = current;
}
$("file").onchange = () => { $("text").value = texts[$("file").value]; };
$("text").oninput = () => { texts[$("file").value] = $("text").value; refreshSoon(); };
$("text").onkeydown = (e) => {
  if (e.key !== "Tab") return;
  e.preventDefault();
  $("text").setRangeText("  ", $("text").selectionStart, $("text").selectionEnd, "end");
  $("text").oninput();
};

async function save() {
  const files = unsaved();
  if (!Object.keys(files).length) return;
  await api("/api/save", { files });
  Object.assign(saved, files);
  await refresh();
}
$("save").onclick = save;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); }
});

// --- try panel
async function tryIt(values) {
  $("busy").textContent = values ? "" : "classifying…";
  const body = { files: unsaved(), turn: $("turn").value, response: $("response").value, ...values };
  try {
    attempt = await api("/api/try", body);
    renderAttempt();
    renderGrids();
  } catch (e) {
    $("result").innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
  $("busy").textContent = "";
}
$("classify").onclick = () => tryIt();
$("turn").onkeydown = $("response").onkeydown = (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && hasClassifier) tryIt();
};

// The values the panel shows, as the page sets them: a value left blank is not sent.
function chosen() {
  const turn_values = {}, response_values = {};
  document.querySelectorAll("#result select[data-side=turn]").forEach((s) => { if (s.value) turn_values[s.dataset.axis] = s.value; });
  document.querySelectorAll("#result select[data-side=response]").forEach((s) => { if (s.value) response_values[s.dataset.axis] = s.value; });
  document.querySelectorAll("#result input[data-side=response]").forEach((i) => {
    response_values[i.dataset.axis] ??= [];
    if (i.checked) response_values[i.dataset.axis].push(i.value);
  });
  const anyResponse = Object.values(response_values).some((v) => typeof v === "string" || v.length);
  return { turn_values, response_values: anyResponse ? response_values : null };
}

function scores(c, axis) {
  const answer = c.scores?.[axis.id];
  if (!answer?.probabilities) return c.evidence?.[axis.id] ? `“${esc(c.evidence[axis.id])}”` : "";
  const ids = axis.values.map((v) => v.id);
  return Object.entries(answer.probabilities)
    .map(([k, p]) => [answer.type === "score" ? ids[+k] : k, p]).sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([k, p]) => `${esc(k)} ${p.toFixed(2)}`).join(" · ");
}

function questions(c) {
  return Object.entries(c.scores || {}).filter(([k]) => k.includes(":")).sort((a, b) => (b[1].noul ?? 0) - (a[1].noul ?? 0))
    .slice(0, 4).map(([k, a]) => `${esc(k)} ${(a.noul ?? 0).toFixed(2)}`).join(" · ");
}

function axisRows(side, axes, c, failed = new Set()) {
  return axes.map((axis) => {
    const value = c?.values?.[axis.id];
    let control;
    if (axis.multi) {
      const taken = Array.isArray(value) ? value : value ? [value] : [];
      control = axis.values.map((v) => `<label title="${esc(v.label)}" style="white-space:nowrap"><input type="checkbox" data-side="${side}" data-axis="${esc(axis.id)}" value="${esc(v.id)}"${taken.includes(v.id) ? " checked" : ""}> ${esc(v.id)}</label>`).join(" ");
    } else {
      control = `<select data-side="${side}" data-axis="${esc(axis.id)}"><option value="">—</option>` + axis.values.map((v) =>
        `<option value="${esc(v.id)}"${v.id === value ? " selected" : ""}>${esc(v.id)} · ${esc(v.label)}</option>`).join("") + "</select>";
    }
    return `<tr><th${failed.has(axis.id) ? ' class="ko"' : ""}>${ref("axis", axis.id)}</th><td>${control}<div class="scores">${c ? scores(c, axis) : ""}</div></td></tr>`;
  }).join("");
}

const NO_CLASSIFIER = `<div class="note">No classifier: set the values by hand, or restart with one, such as:
<pre>export RULESWITCH_SYSTEMONE_URL=https://openrouter.ai/api
export RULESWITCH_SYSTEMONE_KEY=$OPENROUTER_API_KEY
ruleswitch serve POLICY --classifier systemone:liquid/d1-ultra</pre></div>`;

function renderAttempt() {
  if (!policy) return;
  const a = attempt, p = a?.prescription;
  const articles = a?.compliance?.articles || [];
  const failed = new Set(articles.filter((x) => x.kind === "cell").map((x) => x.detail.split(" ")[0]));
  let verdict = "";
  if (a) {
    const where = p ? `Tier ${tierNumber(p.tier)}: ${esc(tierOf(p.tier)?.label)}, cell ${ref("cell", p.cell)}` : "No tier applies";
    const ok = a.compliance && (a.compliance.ok ? '<span class="pill ok">Complies</span>' : '<span class="pill ko">Does not comply</span>');
    const why = articles.map((x) => `<li>${x.kind === "cell" ? esc(x.detail) : "breaches " + ref("prohibition", x.id)}</li>`).join("");
    verdict = `<div class="verdict">${ok ? ok + " " : ""}${where}${why ? `<ul>${why}</ul>` : ""}</div>`;
  }
  const allowed = p ? Object.entries(p.allowed).map(([axis, ids]) => `<div>${ref("axis", axis)}: ${ids.map((id) => valueRef(axis, id)).join(" or ")}</div>`).join("") || '<div class="muted">Any value: only the prohibitions apply.</div>' : "";
  const reminders = a ? [...a.turn.reminders.map((r) => `<div>Reminds ${ref("prohibition", r)}</div>`),
    ...a.hits.map((h) => `<div>“${esc(h.text)}” reminds ${ref("prohibition", h.reminds)} <span class="muted">${esc(h.meaning)}</span></div>`)].join("") : "";
  const breaches = (a?.response?.breaches || []).filter((b) => b.quote).map((b) => `<div class="scores">${esc(b.prohibition)}: “${esc(b.quote)}” ${esc(b.why)}</div>`).join("");
  if (hasClassifier && !a) return void ($("result").innerHTML = "");
  $("result").innerHTML = (hasClassifier ? "" : NO_CLASSIFIER) + verdict + `
    <h3>Turn</h3><table>${axisRows("turn", policy.turn_axes, a?.turn)}</table>
    <div class="scores">${a ? questions(a.turn) : ""}</div>${reminders}` + (a ? `
    <h3>Prescription</h3>${p ? allowed : '<p class="muted">Only the prohibitions constrain the response.</p>'}
    <h3>Nudge</h3>${a.nudge ? `<pre class="nudge">${esc(a.nudge)}</pre>` : '<p class="muted">None: the agent would respond right unprompted.</p>'}
    <h3>Response</h3><table>${axisRows("response", policy.response_axes, a.response, failed)}</table>
    <div class="scores">${a.response ? questions(a.response) : ""}</div>${breaches}` : "");
  document.querySelectorAll("#result select, #result input").forEach((el) => el.onchange = () => tryIt(chosen()));
}

// --- a small Markdown renderer for the `document` rendering: headings, lists, tables, emphasis, code, <br>.
// It anchors each tier, axis, value and prohibition where the default template defines it, for the ids to jump to.
function inline(s) {
  return esc(s).replace(/&lt;br&gt;/g, "<br>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
}
function markdown(text) {
  const out = [], lines = text.split("\n");
  const cells = (line) => line.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  const title = (id) => id.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
  const anchored = new Set();
  const anchor = (key) => { if (anchored.has(key)) return ""; anchored.add(key); return ` id="def-${esc(key)}"`; };
  let side = null, axis = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^(#{1,4}) (.*)/))) {
      const level = m[1].length, text = m[2];
      let id = "";
      if (level === 2) {
        side = { "The turn": "turn_axes", "The response": "response_axes", "Prohibitions": "prohibitions" }[text] ?? null;
        const tier = policy.tiers.find((t) => t.label === text);
        if (tier) id = anchor(`tier-${tier.id}`);
      } else if (level === 3 && side?.endsWith("axes")) {
        axis = policy[side].find((a) => title(a.id) === text);
        if (axis) id = anchor(`axis-${axis.id}`);
      }
      out.push(`<h${level}${id}>${inline(text)}</h${level}>`);
    } else if (line.startsWith("|") && lines[i + 1]?.match(/^\|[-| ]+\|$/)) {
      const rows = [`<tr>${cells(line).map((c) => `<th>${inline(c)}</th>`).join("")}</tr>`];
      for (i += 2; i < lines.length && lines[i].startsWith("|"); i++) {
        const row = cells(lines[i]);
        let id = "";
        if (axis && side?.endsWith("axes") && (m = row[0].match(/\(([A-Za-z0-9_]+)\)/)) && axis.values.some((v) => v.id === m[1])) id = anchor(`value-${axis.id}-${m[1]}`);
        if (side === "prohibitions" && (m = row[0].match(/^\*\*([A-Za-z0-9_]+)\*\*:/))) id = anchor(`prohibition-${m[1]}`);
        rows.push(`<tr${id}>${row.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`);
      }
      i--;
      out.push(`<div class="table"><table>${rows.join("")}</table></div>`);
    } else if ((m = line.match(/^(\d+\.|-) (.*)/))) {
      const tag = m[1] === "-" ? "ul" : "ol", items = [];
      for (; i < lines.length && (m = lines[i].match(/^(\d+\.|-) (.*)/)); i++) items.push(`<li>${inline(m[2])}</li>`);
      i--;
      out.push(`<${tag}>${items.join("")}</${tag}>`);
    } else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  return out.join("\n");
}

(async () => {
  const start = await api("/api/files");
  saved = start.files;
  texts = { ...saved };
  hasClassifier = start.classifier;
  $("classify").hidden = !hasClassifier;
  if (!hasClassifier) $("turn").oninput = () => { clearTimeout(timer); timer = setTimeout(() => tryIt(chosen()), 400); };
  await refresh();
  $("text").value = texts[$("file").value];
})();
</script>
